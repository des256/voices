[project]
name = "voices-backend"
version = "0.1.0"
description = "Voice analysis backend for voices.germansmedia.nl"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "torch>=2.4",
    "transformers>=4.45,<5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs downloaded models and ffmpeg"]
